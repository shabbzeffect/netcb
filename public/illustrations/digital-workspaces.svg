<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="monitor-grad" x1="100" y1="20" x2="100" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0.05"/>
    </linearGradient>
  </defs>
  <!-- Monitor -->
  <rect x="30" y="30" width="140" height="95" rx="8" fill="#0a0e14" stroke="#00e5ff" stroke-opacity="0.3" stroke-width="1.2"/>
  <!-- Screen -->
  <rect x="38" y="38" width="124" height="79" rx="4" fill="url(#monitor-grad)"/>
  <!-- Screen content - dashboard -->
  <rect x="46" y="46" width="50" height="30" rx="3" fill="#00e5ff" fill-opacity="0.08" stroke="#00e5ff" stroke-opacity="0.15" stroke-width="0.5"/>
  <rect x="102" y="46" width="54" height="14" rx="3" fill="#7c3aed" fill-opacity="0.08" stroke="#7c3aed" stroke-opacity="0.15" stroke-width="0.5"/>
  <rect x="102" y="64" width="54" height="12" rx="3" fill="#00e5ff" fill-opacity="0.06" stroke="#00e5ff" stroke-opacity="0.1" stroke-width="0.5"/>
  <!-- Chart bars -->
  <rect x="50" y="62" width="6" height="10" rx="1" fill="#00e5ff" fill-opacity="0.4"/>
  <rect x="58" y="58" width="6" height="14" rx="1" fill="#00e5ff" fill-opacity="0.5"/>
  <rect x="66" y="54" width="6" height="18" rx="1" fill="#00e5ff" fill-opacity="0.6"/>
  <rect x="74" y="60" width="6" height="12" rx="1" fill="#00e5ff" fill-opacity="0.45"/>
  <rect x="82" y="52" width="6" height="20" rx="1" fill="#00e5ff" fill-opacity="0.7"/>
  <!-- Status indicators -->
  <circle cx="50" cy="90" r="3" fill="#22c55e" fill-opacity="0.6"/>
  <rect x="56" y="88" width="30" height="4" rx="1" fill="#22c55e" fill-opacity="0.2"/>
  <circle cx="50" cy="100" r="3" fill="#00e5ff" fill-opacity="0.5"/>
  <rect x="56" y="98" width="25" height="4" rx="1" fill="#00e5ff" fill-opacity="0.15"/>
  <circle cx="50" cy="110" r="3" fill="#f59e0b" fill-opacity="0.5"/>
  <rect x="56" y="108" width="20" height="4" rx="1" fill="#f59e0b" fill-opacity="0.15"/>
  <!-- Monitor stand -->
  <rect x="85" y="125" width="30" height="8" rx="2" fill="#0a0e14" stroke="#00e5ff" stroke-opacity="0.2" stroke-width="1"/>
  <rect x="75" y="133" width="50" height="4" rx="2" fill="#0a0e14" stroke="#00e5ff" stroke-opacity="0.15" stroke-width="1"/>
  <!-- Laptop -->
  <rect x="25" y="145" width="65" height="42" rx="4" fill="#0a0e14" stroke="#7c3aed" stroke-opacity="0.3" stroke-width="1"/>
  <rect x="29" y="149" width="57" height="30" rx="2" fill="#7c3aed" fill-opacity="0.06"/>
  <!-- Laptop content -->
  <rect x="33" y="153" width="20" height="3" rx="1" fill="#7c3aed" fill-opacity="0.3"/>
  <rect x="33" y="158" width="35" height="2" rx="1" fill="#7c3aed" fill-opacity="0.15"/>
  <rect x="33" y="163" width="28" height="2" rx="1" fill="#7c3aed" fill-opacity="0.12"/>
  <rect x="33" y="168" width="40" height="2" rx="1" fill="#7c3aed" fill-opacity="0.1"/>
  <!-- Laptop base -->
  <rect x="20" y="187" width="75" height="5" rx="2" fill="#0a0e14" stroke="#7c3aed" stroke-opacity="0.2" stroke-width="0.8"/>
  <!-- Phone -->
  <rect x="120" y="148" width="30" height="50" rx="5" fill="#0a0e14" stroke="#00e5ff" stroke-opacity="0.25" stroke-width="1"/>
  <rect x="124" y="155" width="22" height="32" rx="2" fill="#00e5ff" fill-opacity="0.05"/>
  <!-- Phone content -->
  <rect x="127" y="158" width="16" height="3" rx="1" fill="#00e5ff" fill-opacity="0.25"/>
  <rect x="127" y="163" width="12" height="2" rx="1" fill="#00e5ff" fill-opacity="0.12"/>
  <rect x="127" y="167" width="14" height="2" rx="1" fill="#00e5ff" fill-opacity="0.1"/>
  <circle cx="135" cy="175" r="4" fill="none" stroke="#00e5ff" stroke-opacity="0.2" stroke-width="0.8"/>
  <!-- Connection arcs -->
  <path d="M95 125 Q110 135 120 148" fill="none" stroke="#00e5ff" stroke-opacity="0.15" stroke-width="0.8" stroke-dasharray="3 3"/>
  <path d="M90 145 Q100 140 120 148" fill="none" stroke="#7c3aed" stroke-opacity="0.15" stroke-width="0.8" stroke-dasharray="3 3"/>
</svg>