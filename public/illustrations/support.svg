<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="support-grad" x1="100" y1="20" x2="100" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0.05"/>
    </linearGradient>
  </defs>
  <!-- Headset band -->
  <path d="M55 90 Q55 45 100 40 Q145 45 145 90" fill="none" stroke="#00e5ff" stroke-opacity="0.4" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Left ear cup -->
  <rect x="40" y="80" width="22" height="35" rx="8" fill="#0a0e14" stroke="#00e5ff" stroke-opacity="0.35" stroke-width="1.2"/>
  <rect x="44" y="85" width="14" height="25" rx="5" fill="#00e5ff" fill-opacity="0.08"/>
  <!-- Right ear cup -->
  <rect x="138" y="80" width="22" height="35" rx="8" fill="#0a0e14" stroke="#00e5ff" stroke-opacity="0.35" stroke-width="1.2"/>
  <rect x="142" y="85" width="14" height="25" rx="5" fill="#00e5ff" fill-opacity="0.08"/>
  <!-- Microphone arm -->
  <path d="M40 105 L30 105 Q22 105 22 113 L22 130" fill="none" stroke="#00e5ff" stroke-opacity="0.3" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Mic head -->
  <ellipse cx="22" cy="135" rx="6" ry="8" fill="#0a0e14" stroke="#00e5ff" stroke-opacity="0.35" stroke-width="1"/>
  <ellipse cx="22" cy="135" rx="3" ry="5" fill="#00e5ff" fill-opacity="0.15"/>
  <!-- Signal waves -->
  <path d="M30 130 Q36 125 30 120" fill="none" stroke="#22c55e" stroke-opacity="0.4" stroke-width="1" stroke-linecap="round"/>
  <path d="M34 134 Q42 127 34 120" fill="none" stroke="#22c55e" stroke-opacity="0.3" stroke-width="1" stroke-linecap="round"/>
  <path d="M38 138 Q48 128 38 118" fill="none" stroke="#22c55e" stroke-opacity="0.2" stroke-width="1" stroke-linecap="round"/>
  <!-- Chat bubbles -->
  <rect x="155" y="50" width="30" height="18" rx="6" fill="#00e5ff" fill-opacity="0.08" stroke="#00e5ff" stroke-opacity="0.2" stroke-width="0.8"/>
  <rect x="160" y="55" width="15" height="2" rx="1" fill="#00e5ff" fill-opacity="0.25"/>
  <rect x="160" y="60" width="20" height="2" rx="1" fill="#00e5ff" fill-opacity="0.15"/>
  <rect x="145" y="72" width="28" height="16" rx="6" fill="#7c3aed" fill-opacity="0.08" stroke="#7c3aed" stroke-opacity="0.2" stroke-width="0.8"/>
  <rect x="150" y="77" width="12" height="2" rx="1" fill="#7c3aed" fill-opacity="0.25"/>
  <rect x="150" y="82" width="18" height="2" rx="1" fill="#7c3aed" fill-opacity="0.15"/>
  <!-- Status indicators -->
  <circle cx="100" cy="155" r="12" fill="#0a0e14" stroke="#22c55e" stroke-opacity="0.3" stroke-width="1"/>
  <circle cx="100" cy="155" r="6" fill="#22c55e" fill-opacity="0.15"/>
  <circle cx="100" cy="155" r="2" fill="#22c55e" fill-opacity="0.6"/>
  <!-- Ticket IDs -->
  <rect x="60" y="170" width="25" height="8" rx="3" fill="#00e5ff" fill-opacity="0.06" stroke="#00e5ff" stroke-opacity="0.12" stroke-width="0.5"/>
  <rect x="88" y="170" width="25" height="8" rx="3" fill="#22c55e" fill-opacity="0.06" stroke="#22c55e" stroke-opacity="0.12" stroke-width="0.5"/>
  <rect x="116" y="170" width="25" height="8" rx="3" fill="#7c3aed" fill-opacity="0.06" stroke="#7c3aed" stroke-opacity="0.12" stroke-width="0.5"/>
  <!-- Resolution time arc -->
  <path d="M70 190 A30 30 0 0 1 130 190" fill="none" stroke="#00e5ff" stroke-opacity="0.15" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="100" y="193" text-anchor="middle" font-family="monospace" font-size="6" fill="#00e5ff" fill-opacity="0.4">SLA</text>
</svg>