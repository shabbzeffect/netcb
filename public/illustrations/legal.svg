<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="legal-grad" x1="100" y1="20" x2="100" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0.05"/>
    </linearGradient>
  </defs>
  <!-- Scale beam -->
  <line x1="100" y1="35" x2="100" y2="90" stroke="#00e5ff" stroke-opacity="0.4" stroke-width="1.5"/>
  <!-- Scale top -->
  <circle cx="100" cy="30" r="6" fill="#0a0e14" stroke="#00e5ff" stroke-opacity="0.4" stroke-width="1.2"/>
  <circle cx="100" cy="30" r="2" fill="#00e5ff" fill-opacity="0.5"/>
  <!-- Scale beam horizontal -->
  <line x1="50" y1="60" x2="150" y2="60" stroke="#00e5ff" stroke-opacity="0.35" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Left pan -->
  <path d="M50 60 L40 95 Q50 100 60 95 L50 60Z" fill="#00e5ff" fill-opacity="0.06" stroke="#00e5ff" stroke-opacity="0.25" stroke-width="1"/>
