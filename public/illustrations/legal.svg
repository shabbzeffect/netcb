  <path d="M150 60 L140 85 Q150 90 160 85 L150 60Z" fill="#7c3aed" fill-opacity="0.06" stroke="#7c3aed" stroke-opacity="0.25" stroke-width="1"/>
  <line x1="150" y1="60" x2="140" y2="85" stroke="#7c3aed" stroke-opacity="0.2" stroke-width="0.8"/>
  <line x1="150" y1="60" x2="160" y2="85" stroke="#7c3aed" stroke-opacity="0.2" stroke-width="0.8"/>
  <!-- Document -->
  <rect x="80" y="105" width="40" height="50" rx="3" fill="#0a0e14" stroke="#00e5ff" stroke-opacity="0.25" stroke-width="1"/>
  <rect x="86" y="112" width="28" height="3" rx="1" fill="#00e5ff" fill-opacity="0.3"/>
  <rect x="86" y="118" width="22" height="2" rx="1" fill="#e8ecf0" fill-opacity="0.12"/>
  <rect x="86" y="123" width="26" height="2" rx="1" fill="#e8ecf0" fill-opacity="0.1"/>
  <rect x="86" y="128" width="18" height="2" rx="1" fill="#e8ecf0" fill-opacity="0.08"/>
  <rect x="86" y="133" width="24" height="2" rx="1" fill="#e8ecf0" fill-opacity="0.1"/>
  <rect x="86" y="138" width="20" height="2" rx="1" fill="#e8ecf0" fill-opacity="0.08"/>
  <rect x="86" y="143" width="15" height="2" rx="1" fill="#e8ecf0" fill-opacity="0.08"/>
  <!-- Checkmark -->
  <circle cx="145" cy="120" r="10" fill="#22c55e" fill-opacity="0.1" stroke="#22c55e" stroke-opacity="0.3" stroke-width="1"/>
  <path d="M140 120 L144 124 L151 116" fill="none" stroke="#22c55e" stroke-opacity="0.6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Shield badge -->
  <path d="M55 115 L55 130 Q55 140 65 145 Q75 140 75 130 L75 115 Z" fill="#0a0e14" stroke="#00e5ff" stroke-opacity="0.2" stroke-width="0.8"/>
  <path d="M62 125 L65 128 L70 122" fill="none" stroke="#00e5ff" stroke-opacity="0.4" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Base -->
  <rect x="70" y="165" width="60" height="5" rx="2" fill="#0a0e14" stroke="#00e5ff" stroke-opacity="0.15" stroke-width="0.8"/>
  <rect x="85" y="160" width="30" height="8" rx="2" fill="#0a0e14" stroke="#00e5ff" stroke-opacity="0.1" stroke-width="0.6"/>
  <!-- Compliance badges -->
  <rect x="30" y="170" width="30" height="10" rx="4" fill="#00e5ff" fill-opacity="0.05" stroke="#00e5ff" stroke-opacity="0.12" stroke-width="0.5"/>
