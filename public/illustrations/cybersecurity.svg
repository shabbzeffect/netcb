<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="shield-grad" x1="100" y1="20" x2="100" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="shield-stroke" x1="100" y1="20" x2="100" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0.4"/>
    </linearGradient>
  </defs>
  <!-- Shield shape -->
  <path d="M100 15 L170 50 L170 100 Q170 150 100 185 Q30 150 30 100 L30 50 Z" fill="url(#shield-grad)" stroke="url(#shield-stroke)" stroke-width="1.5"/>
  <!-- Inner shield -->
  <path d="M100 35 L155 62 L155 100 Q155 140 100 168 Q45 140 45 100 L45 62 Z" fill="none" stroke="#00e5ff" stroke-opacity="0.2" stroke-width="1"/>
  <!-- Lock icon in center -->
  <rect x="82" y="95" width="36" height="28" rx="4" fill="#00e5ff" fill-opacity="0.15" stroke="#00e5ff" stroke-width="1.5"/>
  <path d="M90 95 L90 82 Q90 72 100 72 Q110 72 110 82 L110 95" fill="none" stroke="#00e5ff" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="100" cy="108" r="4" fill="#00e5ff"/>
  <line x1="100" y1="112" x2="100" y2="118" stroke="#00e5ff" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Scan lines -->
  <line x1="55" y1="60" x2="145" y2="60" stroke="#00e5ff" stroke-opacity="0.1" stroke-width="0.5"/>
  <line x1="50" y1="130" x2="150" y2="130" stroke="#00e5ff" stroke-opacity="0.1" stroke-width="0.5"/>
  <!-- Corner accents -->
  <circle cx="100" cy="35" r="2" fill="#00e5ff" fill-opacity="0.6"/>
  <circle cx="45" cy="75" r="1.5" fill="#00e5ff" fill-opacity="0.4"/>
  <circle cx="155" cy="75" r="1.5" fill="#00e5ff" fill-opacity="0.4"/>
