<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="terminal-grad" x1="100" y1="20" x2="100" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0.05"/>
    </linearGradient>
  </defs>
  <!-- Terminal window -->
  <rect x="25" y="25" width="150" height="110" rx="6" fill="#0a0e14" stroke="#22c55e" stroke-opacity="0.3" stroke-width="1.2"/>
  <!-- Title bar -->
  <rect x="25" y="25" width="150" height="22" rx="6" fill="#111722"/>
  <rect x="25" y="41" width="150" height="6" fill="#111722"/>
  <!-- Window controls -->
  <circle cx="40" cy="36" r="4" fill="#ef4444" fill-opacity="0.6"/>
  <circle cx="54" cy="36" r="4" fill="#f59e0b" fill-opacity="0.6"/>
  <circle cx="68" cy="36" r="4" fill="#22c55e" fill-opacity="0.6"/>
  <!-- Title text -->
  <rect x="90" y="33" width="40" height="5" rx="1" fill="#22c55e" fill-opacity="0.3"/>
  <!-- Terminal content -->
  <rect x="35" y="55" width="8" height="4" rx="1" fill="#22c55e" fill-opacity="0.6"/>
  <rect x="47" y="55" width="50" height="4" rx="1" fill="#00e5ff" fill-opacity="0.3"/>
  <rect x="35" y="64" width="12" height="4" rx="1" fill="#00e5ff" fill-opacity="0.5"/>
  <rect x="51" y="64" width="35" height="4" rx="1" fill="#e8ecf0" fill-opacity="0.2"/>
  <rect x="35" y="73" width="8" height="4" rx="1" fill="#22c55e" fill-opacity="0.6"/>
  <rect x="47" y="73" width="65" height="4" rx="1" fill="#e8ecf0" fill-opacity="0.15"/>
  <rect x="35" y="82" width="15" height="4" rx="1" fill="#f59e0b" fill-opacity="0.5"/>
  <rect x="54" y="82" width="40" height="4" rx="1" fill="#e8ecf0" fill-opacity="0.12"/>
  <rect x="35" y="91" width="8" height="4" rx="1" fill="#22c55e" fill-opacity="0.6"/>
  <rect x="47" y="91" width="55" height="4" rx="1" fill="#00e5ff" fill-opacity="0.25"/>
  <rect x="35" y="100" width="20" height="4" rx="1" fill="#22c55e" fill-opacity="0.4"/>
  <rect x="59" y="100" width="30" height="4" rx="1" fill="#e8ecf0" fill-opacity="0.15"/>
  <!-- Cursor blink -->
  <rect x="35" y="109" width="8" height="4" rx="1" fill="#22c55e" fill-opacity="0.8"/>
  <!-- Code symbols floating -->
  <text x="140" y="65" font-family="monospace" font-size="10" fill="#22c55e" fill-opacity="0.3">&lt;/&gt;</text>
  <text x="145" y="85" font-family="monospace" font-size="8" fill="#00e5ff" fill-opacity="0.25">{}</text>
  <text x="138" y="105" font-family="monospace" font-size="9" fill="#f59e0b" fill-opacity="0.2">#!</text>
  <!-- Git branch visual -->
  <circle cx="50" cy="145" r="6" fill="#0a0e14" stroke="#22c55e" stroke-opacity="0.4" stroke-width="1"/>
  <circle cx="50" cy="145" r="2" fill="#22c55e" fill-opacity="0.6"/>
  <circle cx="80" cy="145" r="6" fill="#0a0e14" stroke="#00e5ff" stroke-opacity="0.4" stroke-width="1"/>
  <circle cx="80" cy="145" r="2" fill="#00e5ff" fill-opacity="0.6"/>
  <circle cx="110" cy="145" r="6" fill="#0a0e14" stroke="#22c55e" stroke-opacity="0.4" stroke-width="1"/>
  <circle cx="110" cy="145" r="2" fill="#22c55e" fill-opacity="0.6"/>
  <circle cx="140" cy="145" r="6" fill="#0a0e14" stroke="#f59e0b" stroke-opacity="0.4" stroke-width="1"/>
  <circle cx="140" cy="145" r="2" fill="#f59e0b" fill-opacity="0.6"/>
  <!-- Branch lines -->
  <line x1="56" y1="145" x2="74" y2="145" stroke="#22c55e" stroke-opacity="0.3" stroke-width="1"/>
  <line x1="86" y1="145" x2="104" y2="145" stroke="#00e5ff" stroke-opacity="0.3" stroke-width="1"/>
  <line x1="116" y1="145" x2="134" y2="145" stroke="#f59e0b" stroke-opacity="0.3" stroke-width="1"/>
  <!-- Branch labels -->
  <rect x="38" y="155" width="24" height="8" rx="2" fill="#22c55e" fill-opacity="0.1" stroke="#22c55e" stroke-opacity="0.2" stroke-width="0.5"/>
  <rect x="68" y="155" width="24" height="8" rx="2" fill="#00e5ff" fill-opacity="0.1" stroke="#00e5ff" stroke-opacity="0.2" stroke-width="0.5"/>
  <rect x="98" y="155" width="24" height="8" rx="2" fill="#22c55e" fill-opacity="0.1" stroke="#22c55e" stroke-opacity="0.2" stroke-width="0.5"/>
  <rect x="128" y="155" width="24" height="8" rx="2" fill="#f59e0b" fill-opacity="0.1" stroke="#f59e0b" stroke-opacity="0.2" stroke-width="0.5"/>
  <!-- Linux penguin silhouette -->
  <ellipse cx="100" cy="185" rx="15" ry="10" fill="#22c55e" fill-opacity="0.08"/>
  <circle cx="100" cy="175" r="5" fill="#22c55e" fill-opacity="0.12"/>
  <ellipse cx="96" cy="173" rx="1.5" ry="2" fill="#e8ecf0" fill-opacity="0.2"/>
  <ellipse cx="104" cy="173" rx="1.5" ry="2" fill="#e8ecf0" fill-opacity="0.2"/>
</svg>