<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <defs>
    <linearGradient id="workspace-hero" x1="200" y1="0" x2="200" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0.02"/>
    </linearGradient>
  </defs>
  <!-- Desktop monitor -->
  <rect x="60" y="30" width="200" height="130" rx="8" fill="#0a0e14" stroke="#00e5ff" stroke-opacity="0.3" stroke-width="1.2"/>
  <rect x="70" y="40" width="180" height="110" rx="4" fill="url(#workspace-hero)"/>
  <!-- Dashboard on screen -->
  <rect x="80" y="50" width="70" height="45" rx="3" fill="#00e5ff" fill-opacity="0.06" stroke="#00e5ff" stroke-opacity="0.12" stroke-width="0.5"/>
  <rect x="160" y="50" width="80" height="20" rx="3" fill="#7c3aed" fill-opacity="0.06" stroke="#7c3aed" stroke-opacity="0.12" stroke-width="0.5"/>
  <rect x="160" y="75" width="80" height="20" rx="3" fill="#00e5ff" fill-opacity="0.04" stroke="#00e5ff" stroke-opacity="0.08" stroke-width="0.5"/>
  <!-- Chart bars -->
  <rect x="85" y="75" width="8" height="15" rx="1" fill="#00e5ff" fill-opacity="0.3"/>
  <rect x="96" y="70" width="8" height="20" rx="1" fill="#00e5ff" fill-opacity="0.4"/>
  <rect x="107" y="65" width="8" height="25" rx="1" fill="#00e5ff" fill-opacity="0.5"/>
  <rect x="118" y="72" width="8" height="18" rx="1" fill="#00e5ff" fill-opacity="0.35"/>
  <rect x="129" y="60" width="8" height="30" rx="1" fill="#00e5ff" fill-opacity="0.6"/>
  <!-- Monitor stand -->
  <rect x="140" y="160" width="40" height="10" rx="3" fill="#0a0e14" stroke="#00e5ff" stroke-opacity="0.2" stroke-width="1"/>
  <rect x="125" y="170" width="70" height="6" rx="3" fill="#0a0e14" stroke="#00e5ff" stroke-opacity="0.15" stroke-width="1"/>
  <!-- Laptop -->
  <rect x="280" y="100" width="100" height="65" rx="5" fill="#0a0e14" stroke="#7c3aed" stroke-opacity="0.3" stroke-width="1"/>
  <rect x="286" y="106" width="88" height="50" rx="3" fill="#7c3aed" fill-opacity="0.05"/>
  <rect x="292" y="112" width="40" height="4" rx="1" fill="#7c3aed" fill-opacity="0.2"/>
  <rect x="292" y="119" width="60" height="3" rx="1" fill="#7c3aed" fill-opacity="0.1"/>
  <rect x="292" y="125" width="50" height="3" rx="1" fill="#7c3aed" fill-opacity="0.08"/>
  <rect x="275" y="165" width="110" height="6" rx="2" fill="#0a0e14" stroke="#7c3aed" stroke-opacity="0.15" stroke-width="0.8"/>
  <!-- Phone -->
  <rect x="310" y="190" width="45" height="75" rx="7" fill="#0a0e14" stroke="#00e5ff" stroke-opacity="0.25" stroke-width="1"/>
  <rect x="316" y="200" width="33" height="50" rx="3" fill="#00e5ff" fill-opacity="0.04"/>
  <rect x="320" y="205" width="20" height="3" rx="1" fill="#00e5ff" fill-opacity="0.2"/>
  <rect x="320" y="211" width="25" height="2" rx="1" fill="#00e5ff" fill-opacity="0.1"/>
  <rect x="320" y="216" width="18" height="2" rx="1" fill="#00e5ff" fill-opacity="0.08"/>
  <circle cx="332" cy="235" r="5" fill="none" stroke="#00e5ff" stroke-opacity="0.15" stroke-width="0.8"/>
  <!-- Sync arrows -->
  <path d="M260 130 Q275 125 280 130" fill="none" stroke="#00e5ff" stroke-opacity="0.2" stroke-width="0.8"/>
  <path d="M260 140 Q275 145 280 140" fill="none" stroke="#7c3aed" stroke-opacity="0.2" stroke-width="0.8"/>
  <path d="M240 165 Q265 180 310 195" fill="none" stroke="#00e5ff" stroke-opacity="0.15" stroke-width="0.8" stroke-dasharray="3 3"/>
  <!-- Zero trust badge -->
  <rect x="70" y="195" width="80" height="28" rx="6" fill="#0a0e14" stroke="#22c55e" stroke-opacity="0.2" stroke-width="0.8"/>
  <circle cx="88" cy="209" r="6" fill="#22c55e" fill-opacity="0.1" stroke="#22c55e" stroke-opacity="0.3" stroke-width="0.8"/>
  <path d="M85 209 L87 211 L91 207" fill="none" stroke="#22c55e" stroke-opacity="0.5" stroke-width="1" stroke-linecap="round"/>
  <rect x="98" y="205" width="40" height="3" rx="1" fill="#22c55e" fill-opacity="0.2"/>
  <rect x="98" y="211" width="30" height="2" rx="1" fill="#22c55e" fill-opacity="0.1"/>
</svg>